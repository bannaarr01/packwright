version: 2
updates:
  # Go module at repo root — the single source of truth for the binary.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GUI frontend: Svelte 5 + Vite + Tailwind + Wails JS shims.
  - package-ecosystem: npm
    directory: /gui/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  # Repo-root tooling: Husky hooks. Keep this tiny — it should never
  # contain production deps.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tooling:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions workflows — ci.yml plus any future release / scan jobs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
